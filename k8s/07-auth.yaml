apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: iep-fund
spec:
  # Docker Desktop's Kubernetes assigns "localhost" as the EXTERNAL-IP of
  # LoadBalancer services, so the API is reachable on the host without
  # `kubectl port-forward` (which pins to a single pod and drops under load).
  type: LoadBalancer
  selector:
    app: auth
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: iep-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        # Built locally by scripts/k8s-up.*; never pulled from a registry.
        - name: auth
          image: iep/auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: iep-db-config
            - configMapRef:
                name: iep-director-config
            - secretRef:
                name: iep-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
